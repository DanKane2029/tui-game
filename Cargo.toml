[package]
name = "tui-game"
version = "0.1.0"
edition = "2024"

[dependencies]
# crossterm is NOT declared directly -- it comes through ratatui::crossterm, so
# there is only ever one copy of it in the build.
ratatui = "0.30.2"
color-eyre = "0.6.5"
ron = "0.12.2"
serde = { version = "1.0.219", features = ["derive"] }
rand = "0.10.2"

[dev-dependencies]
# Snapshot-tests frames rendered through ratatui's TestBackend.
insta = "1.48"
# Permutations, for proving incantation resolution is order-independent.
itertools = "0.15"
