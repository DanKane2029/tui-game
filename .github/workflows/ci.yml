name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt, clippy, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the channel and components from rust-toolchain.toml, and caches
      # the cargo registry and target dir.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Build release
        run: cargo build --release

      # The browser build shares all the game code but a different shell, so a
      # change can compile natively and still break the deploy. Catch it here
      # rather than on main.
      - name: Check the web build
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown
